name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        id: diff
        run: |
          # Fetch the base branch to ensure git can see it
          git fetch origin ${{ github.base_ref }} --depth=1

          git diff origin/${{ github.base_ref }} HEAD --unified=5 > diff.txt

          # Stats for the final comment
          ADDED=$(git diff --stat origin/${{ github.base_ref }} HEAD | tail -1 | grep -o '[0-9]* insertion' | grep -o '[0-9]*' || echo "0")
          DELETED=$(git diff --stat origin/${{ github.base_ref }} HEAD | tail -1 | grep -o '[0-9]* deletion' | grep -o '[0-9]*' || echo "0")
          FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | wc -l)

          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Prepare Review Request
        id: prepare
        run: |
          # Read diff (max 6000 chars to avoid payload limits)
          DIFF=$(cat diff.txt | head -c 6000)

          cat > prompt.txt << EOF
          PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
          Repository: ${{ github.repository }}
          Author: ${{ github.event.pull_request.user.login }}

          Please review the following code changes for security, logic errors, and performance:
          $DIFF
          EOF

          ESCAPED_PROMPT=$(cat prompt.txt | jq -sR .)
          cat > request.json <<EOF
          {
            "model": "deepseek-reviewer",
            "prompt": $ESCAPED_PROMPT,
            "stream": true,
            "options": {
              "temperature": 0.1,
              "num_predict": 2048
            }
          }
          EOF
      - name: Debug URL Structure
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
        run: |
          # This prints the length and first 8 characters only
          echo "URL Length: ${#OLLAMA_URL}"
          echo "URL starts with: $(echo $OLLAMA_URL | cut -c1-8)..."
          echo "URL ends with: ...$(echo $OLLAMA_URL | rev | cut -c1-10 | rev)"
      