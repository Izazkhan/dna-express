name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Diff
        id: diff
        run: |
          # Fetch the base branch to ensure git can see it
          git fetch origin ${{ github.base_ref }} --depth=1

          git diff origin/${{ github.base_ref }} HEAD --unified=5 > diff.txt

          # Stats for the final comment
          ADDED=$(git diff --stat origin/${{ github.base_ref }} HEAD | tail -1 | grep -o '[0-9]* insertion' | grep -o '[0-9]*' || echo "0")
          DELETED=$(git diff --stat origin/${{ github.base_ref }} HEAD | tail -1 | grep -o '[0-9]* deletion' | grep -o '[0-9]*' || echo "0")
          FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | wc -l)

          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Prepare Review Request
        id: prepare
        run: |
          # Read diff (max 6000 chars to avoid payload limits)
          DIFF=$(cat diff.txt | head -c 6000)

          cat > prompt.txt << EOF
          PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
          Repository: ${{ github.repository }}
          Author: ${{ github.event.pull_request.user.login }}

          Please review the following code changes for security, logic errors, and performance:
          $DIFF
          EOF

          ESCAPED_PROMPT=$(cat prompt.txt | jq -sR .)
          cat > request.json <<EOF
          {
            "model": "llama-3.3-70b-versatile",
            "messages": [
              {
                "role": "system",
                "content": "
                  You are a Senior Code Reviewer Assistant. Review pull requests with precision and professionalism.
                  ## IDENTITY
                - Role: Senior Software Engineer
                - Style: Constructive, pragmatic, detail-oriented

                ## RESPONSE FORMAT (MUST FOLLOW)
                ### 🎯 Summary
                [2-3 sentence overview]

                ### 🔍 Critical Issues (Must Fix)
                - **Severity**: [High/Medium/Low]
                - Issue: [Description]
                - Location: [File:Line]
                - Suggestion: [Concrete fix]
                - Why: [Impact]

                ### ⚠️ Important Suggestions (Should Fix)
                [Similar structure]

                ### 💡 Minor Improvements (Could Fix)
                [Similar structure]

                ### ✅ Positive Feedback
                [What was done well]

                ### 📊 Metrics
                - Estimated Review Time: [X minutes]
                - Complexity Score: [Simple/Moderate/Complex]
                - Risk Level: [Low/Medium/High]

                ALWAYS use this exact format.
                "
              },
              {
                "role": "user",
                "content": $ESCAPED_PROMPT
              }
            ],
            "temperature": 0.3,
            "max_tokens": 2048
          }
          EOF

      - name: Call Groq API
        id: review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # 1. Enable 'pipefail' so the step fails if curl fails
          set -o pipefail

          echo "Calling Groq API..."

          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "@request.json" \
            --max-time 60)

          echo "Response received"

          # Extract the review content
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -n "$REVIEW" ]; then
            echo "$REVIEW" > review.md
            
            # Extract token usage
            TOKENS=$(echo "$RESPONSE" | jq '.usage.total_tokens // 0')
            echo "tokens=$TOKENS" >> $GITHUB_OUTPUT
            
            echo "✅ Review generated successfully ($TOKENS tokens)"
          else
            echo "❌ Failed to get review"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Post Review to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('review.md')) return;
            const reviewContent = fs.readFileSync('review.md', 'utf8');
            if (!reviewContent.trim()) return;

            const commentBody = `
            ## 🤖 AI Code Review
            ${reviewContent}

            ---
            📊 **Stats**: +${{ steps.diff.outputs.added }}/-${{ steps.diff.outputs.deleted }} in ${{ steps.diff.outputs.files }} files
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.body.includes('## 🤖 AI Code Review')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Handle Failure
        if: failure()
        run: echo "⚠️ AI Review Failed. Check OLLAMA_URL and Tunnel status."
